services:
  schedule-app:
    build:
      context: .
      dockerfile: Dockerfile
    networks:
      - default
      - caddy
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    restart: unless-stopped

networks:
  caddy:
    name: ${CADDY_NETWORK:-schedule-backend_default}
    external: true
